<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoicOps — Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23020617'/%3E%3Cpath d='M7 4v16M12 8v8M17 6v12' stroke='%2338bdf8' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #020617;
    --surface: #0b1021;
    --surface-2: #111827;
    --surface-3: #1a2332;
    --border: rgba(148, 163, 184, 0.12);
    --border-strong: rgba(148, 163, 184, 0.18);
    --text: #f8fafc;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --text-dim: #475569;
    --accent: #38bdf8;
    --accent-2: #0ea5e9;
    --accent-soft: rgba(56, 189, 248, 0.14);
    --accent-glow: rgba(56, 189, 248, 0.3);
    --emerald: #34d399;
    --emerald-soft: rgba(52, 211, 153, 0.14);
    --blue: #60a5fa;
    --blue-soft: rgba(96, 165, 250, 0.14);
    --violet: #a78bfa;
    --violet-soft: rgba(167, 139, 250, 0.12);
    --red: #f87171;
    --red-soft: rgba(248, 113, 113, 0.14);
    --radius: 14px;
    --radius-sm: 10px;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    --mono: 'JetBrains Mono', 'SF Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg); color: var(--text);
    font-family: var(--font); min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Background layers ── */
  .bg-orb {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
  }
  .bg-orb::before, .bg-orb::after {
    content: ''; position: absolute; border-radius: 50%;
    filter: blur(100px); opacity: 0.5;
    animation: orb-float 20s ease-in-out infinite alternate;
  }
  .bg-orb::before {
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(56,189,248,0.18) 0%, transparent 70%);
    top: -180px; right: -140px;
  }
  .bg-orb::after {
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(167,139,250,0.14) 0%, transparent 70%);
    bottom: -140px; left: -100px;
    animation-delay: -9s;
  }
  @keyframes orb-float {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(-25px, 18px) scale(1.06); }
  }
  .bg-grid {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(148,163,184,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(148,163,184,0.05) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(ellipse 90% 70% at 50% 20%, black 30%, transparent 80%);
    -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 20%, black 30%, transparent 80%);
  }
  .bg-noise {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  /* ── Navigation ── */
  .nav {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 32px; height: 64px;
    background: rgba(2, 6, 23, 0.72);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
  }
  .nav-brand {
    display: flex; align-items: center; gap: 12px;
    text-decoration: none; color: var(--text);
  }
  .nav-logo {
    width: 32px; height: 32px; border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), var(--violet));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 24px var(--accent-glow);
  }
  .nav-logo svg { width: 17px; height: 17px; }
  .nav-name { font-weight: 600; font-size: 16px; letter-spacing: -0.02em; }
  .nav-tag {
    font-family: var(--mono); font-size: 10px; font-weight: 500;
    color: var(--text-muted); background: var(--surface-2);
    padding: 3px 8px; border-radius: 999px;
    border: 1px solid var(--border); margin-left: 2px;
  }
  .nav-links { display: flex; align-items: center; gap: 6px; }
  .nav-link {
    font-size: 13px; font-weight: 500; color: var(--text-secondary);
    text-decoration: none; padding: 7px 14px; border-radius: var(--radius-sm);
    transition: color 0.2s, background 0.2s;
  }
  .nav-link:hover { color: var(--text); background: rgba(148,163,184,0.08); }
  .nav-link.active { color: var(--text); background: var(--surface-2); border: 1px solid var(--border); }

  /* ── Layout ── */
  .main {
    position: relative; z-index: 1;
    max-width: 1040px; margin: 0 auto;
    padding: 44px 24px 80px;
  }

  .page-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 32px;
  }
  .page-header h1 {
    font-size: 26px; font-weight: 700; letter-spacing: -0.03em;
  }
  .live-indicator {
    display: flex; align-items: center; gap: 8px;
    font-family: var(--mono); font-size: 11px; color: var(--text-muted);
    background: var(--surface-2); border: 1px solid var(--border);
    padding: 5px 12px; border-radius: 999px;
  }
  .live-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--emerald);
    box-shadow: 0 0 8px rgba(52,211,153,0.45);
    animation: blink 2s ease-in-out infinite;
  }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  /* ── Stat cards ── */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 32px;
  }
  @media (max-width: 700px) {
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
  }

  .stat-card {
    background: rgba(11, 16, 33, 0.6);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    transition: border-color 0.25s, transform 0.25s;
  }
  .stat-card:hover { border-color: rgba(56,189,248,0.2); transform: translateY(-2px); }
  .stat-label {
    font-size: 12px; font-weight: 500; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.04em;
    margin-bottom: 10px;
  }
  .stat-value {
    font-size: 32px; font-weight: 700; letter-spacing: -0.03em;
    line-height: 1;
  }
  .stat-value.c-default { color: var(--text); }
  .stat-value.c-emerald { color: var(--emerald); }
  .stat-value.c-accent { color: var(--accent); }
  .stat-value.c-blue { color: var(--blue); }

  /* ── Table ── */
  .table-card {
    background: rgba(11, 16, 33, 0.6);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .table-head {
    padding: 16px 22px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .table-head h2 { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }

  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left; padding: 12px 22px;
    font-family: var(--mono); font-size: 10.5px; font-weight: 500;
    color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em;
    border-bottom: 1px solid var(--border);
  }
  tbody td {
    padding: 14px 22px; font-size: 13.5px;
    border-bottom: 1px solid var(--border);
    color: var(--text-secondary); vertical-align: middle;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: rgba(255,255,255,0.02); }

  .badge {
    font-family: var(--mono); font-size: 10px; font-weight: 500;
    padding: 3px 9px; border-radius: 999px;
  }
  .badge.success { background: var(--emerald-soft); color: var(--emerald); }
  .badge.failed { background: var(--red-soft); color: var(--red); }

  .mono { font-family: var(--mono); font-size: 12.5px; }
  .truncate {
    max-width: 240px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .empty-row {
    padding: 52px 22px; text-align: center;
    color: var(--text-dim); font-size: 13.5px;
  }

  @media (max-width: 640px) {
    .nav { padding: 0 20px; height: 60px; }
    .nav-tag { display: none; }
    .main { padding: 28px 20px 60px; }
    .page-header { flex-direction: column; align-items: flex-start; gap: 12px; }
    .truncate { max-width: 140px; }
  }
</style>
</head>
<body>

<div class="bg-orb"></div>
<div class="bg-grid"></div>
<div class="bg-noise"></div>

<nav class="nav">
  <a href="/" class="nav-brand">
    <div class="nav-logo">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M7 4v16M12 8v8M17 6v12" stroke="#020617" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </div>
    <span class="nav-name">VoicOps</span>
  </a>
  <div class="nav-links">
    <a href="/" class="nav-link">Home</a>
    <a href="/generate" class="nav-link">Generate</a>
    <a href="/analytics" class="nav-link active">Analytics</a>
  </div>
</nav>

<div class="main">
  <div class="page-header">
    <h1>Analytics</h1>
    <div class="live-indicator">
      <div class="live-dot"></div>
      <span>Auto-refresh 10s</span>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Total Requests</div>
      <div class="stat-value c-default" id="totalRequests">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Success Rate</div>
      <div class="stat-value c-emerald" id="successRate">0%</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Avg Self-Heals</div>
      <div class="stat-value c-accent" id="avgHealing">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Avg Response</div>
      <div class="stat-value c-blue" id="avgTime">0s</div>
    </div>
  </div>

  <div class="table-card">
    <div class="table-head">
      <h2>Recent Requests</h2>
    </div>
    <table>
      <thead>
        <tr>
          <th>Time</th>
          <th>Transcript</th>
          <th>Status</th>
          <th>Healing</th>
          <th>Duration</th>
        </tr>
      </thead>
      <tbody id="recentBody">
        <tr><td colspan="5" class="empty-row">No requests yet. Record your first voice command to get started.</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function fmtTime(iso) {
    if (!iso) return '-';
    return new Date(iso).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit', second:'2-digit' });
  }

  function render(data) {
    document.getElementById('totalRequests').textContent = data.total_requests;
    document.getElementById('successRate').textContent = data.success_rate + '%';
    document.getElementById('avgHealing').textContent = data.avg_healing_count;
    document.getElementById('avgTime').textContent = data.avg_time_taken + 's';

    const tb = document.getElementById('recentBody');
    if (!data.recent_requests || !data.recent_requests.length) {
      tb.innerHTML = '<tr><td colspan="5" class="empty-row">No requests yet. Record your first voice command to get started.</td></tr>';
      return;
    }
    tb.innerHTML = data.recent_requests.map(r => `
      <tr>
        <td class="mono">${fmtTime(r.created_at)}</td>
        <td class="truncate" title="${esc(r.transcript)}">${esc(r.transcript) || '-'}</td>
        <td><span class="badge ${r.status}">${r.status}</span></td>
        <td class="mono">${r.healing_count}</td>
        <td class="mono">${r.time_taken}s</td>
      </tr>
    `).join('');
  }

  async function fetchAnalytics() {
    try {
      const r = await fetch('/api/analytics');
      if (!r.ok) throw new Error();
      render(await r.json());
    } catch(e) { console.error('Analytics error:', e); }
  }

  fetchAnalytics();
  setInterval(fetchAnalytics, 10000);
</script>

</body>
</html>
