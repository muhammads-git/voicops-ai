<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoicOps — Generate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23020617'/%3E%3Crect x='4' y='14' width='16' height='5.5' rx='1.5' fill='%2338bdf8'/%3E%3Crect x='6' y='8.5' width='12' height='5' rx='1.5' fill='%2338bdf8'/%3E%3Crect x='8' y='3.5' width='8' height='4.5' rx='1.5' fill='%2338bdf8'/%3E%3C/svg%3E">
<style>
  :root {
    /* ── Core palette (dark default) ── */
    --bg: #020617;
    --surface: #0b1021;
    --surface-2: #111827;
    --surface-3: #1a2332;
    --border: rgba(148, 163, 184, 0.12);
    --border-strong: rgba(148, 163, 184, 0.18);
    --text: #f8fafc;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --text-dim: #475569;
    --accent: #38bdf8;
    --accent-2: #0ea5e9;
    --accent-soft: rgba(56, 189, 248, 0.14);
    --accent-glow: rgba(56, 189, 248, 0.3);
    --emerald: #34d399;
    --emerald-soft: rgba(52, 211, 153, 0.14);
    --blue: #60a5fa;
    --blue-soft: rgba(96, 165, 250, 0.14);
    --violet: #a78bfa;
    --violet-soft: rgba(167, 139, 250, 0.12);
    --violet-glow: rgba(167, 139, 250, 0.18);
    --red: #f87171;
    --red-soft: rgba(248, 113, 113, 0.14);
    /* ── Component surfaces ── */
    --nav-bg: rgba(2, 6, 23, 0.78);
    --dock-bg: rgba(11, 16, 33, 0.72);
    --dock-recording-bg: rgba(11, 16, 33, 0.82);
    --input-bg: rgba(2, 6, 23, 0.45);
    --card-bg: rgba(2, 6, 23, 0.55);
    --card-head-bg: rgba(17, 24, 39, 0.85);
    --bubble-bg: rgba(17, 24, 39, 0.7);
    --btn-text: #020617;
    --logo-icon: #020617;
    --orb-opacity: 0.5;
    --grid-opacity: 0.05;
    --noise-opacity: 0.03;
    --radius: 14px;
    --radius-lg: 20px;
    --radius-sm: 10px;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    --mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
  }
  .light-theme {
    --bg: #f8fafc;
    --surface: rgba(255, 255, 255, 0.78);
    --surface-2: #f1f5f9;
    --surface-3: #e2e8f0;
    --border: rgba(148, 163, 184, 0.28);
    --border-strong: rgba(148, 163, 184, 0.38);
    --text: #0f172a;
    --text-secondary: #475569;
    --text-muted: #64748b;
    --text-dim: #94a3b8;
    --accent: #0ea5e9;
    --accent-2: #0284c7;
    --accent-soft: rgba(14, 165, 233, 0.12);
    --accent-glow: rgba(14, 165, 233, 0.2);
    --emerald: #10b981;
    --emerald-soft: rgba(16, 185, 129, 0.12);
    --blue: #3b82f6;
    --blue-soft: rgba(59, 130, 246, 0.12);
    --violet: #8b5cf6;
    --violet-soft: rgba(139, 92, 246, 0.12);
    --violet-glow: rgba(139, 92, 246, 0.15);
    --red: #ef4444;
    --red-soft: rgba(239, 68, 68, 0.12);
    --nav-bg: rgba(255, 255, 255, 0.78);
    --dock-bg: rgba(255, 255, 255, 0.82);
    --dock-recording-bg: rgba(255, 255, 255, 0.92);
    --input-bg: rgba(241, 245, 249, 0.85);
    --card-bg: rgba(255, 255, 255, 0.65);
    --card-head-bg: rgba(241, 245, 249, 0.9);
    --bubble-bg: rgba(255, 255, 255, 0.78);
    --btn-text: #ffffff;
    --logo-icon: #ffffff;
    --orb-opacity: 0.22;
    --grid-opacity: 0.08;
    --noise-opacity: 0.015;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--font); height: 100vh; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Background layers ── */
  .bg-orb {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
  }
  .bg-orb::before, .bg-orb::after {
    content: ''; position: absolute; border-radius: 50%;
    filter: blur(110px); opacity: var(--orb-opacity);
    animation: orb-float 20s ease-in-out infinite alternate;
  }
  .bg-orb::before {
    width: 650px; height: 650px;
    background: radial-gradient(circle, rgba(56,189,248,0.2) 0%, transparent 70%);
    top: -200px; right: -180px;
  }
  .bg-orb::after {
    width: 550px; height: 550px;
    background: radial-gradient(circle, rgba(167,139,250,0.16) 0%, transparent 70%);
    bottom: -160px; left: -120px;
    animation-delay: -9s;
  }
  @keyframes orb-float {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(-30px, 20px) scale(1.06); }
  }
  .bg-grid {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(148,163,184,var(--grid-opacity)) 1px, transparent 1px),
      linear-gradient(90deg, rgba(148,163,184,var(--grid-opacity)) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(ellipse 90% 70% at 50% 50%, black 30%, transparent 80%);
    -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 50%, black 30%, transparent 80%);
  }
  .bg-noise {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: var(--noise-opacity);
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  /* ── Navigation ── */
  .nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px; height: 64px;
    background: var(--nav-bg);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
  }
  .nav-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text); }
  .nav-logo {
    width: 32px; height: 32px; border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), var(--violet));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 24px var(--accent-glow);
  }
  .nav-logo svg { width: 17px; height: 17px; }
  .nav-name { font-weight: 600; font-size: 16px; letter-spacing: -0.02em; }
  .nav-tag {
    font-family: var(--mono); font-size: 10px; font-weight: 500;
    color: var(--text-muted); background: var(--surface-2);
    padding: 3px 8px; border-radius: 999px; border: 1px solid var(--border); margin-left: 2px;
  }
  .nav-links { display: flex; align-items: center; gap: 6px; }
  .nav-link {
    font-size: 13px; font-weight: 500; color: var(--text-secondary);
    text-decoration: none; padding: 7px 14px; border-radius: var(--radius-sm);
    transition: color 0.2s, background 0.2s;
  }
  .nav-link:hover { color: var(--text); background: rgba(148,163,184,0.08); }
  .nav-link.active { color: var(--text); background: var(--surface-2); border: 1px solid var(--border); }
  .theme-toggle {
    width: 34px; height: 34px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--surface-2);
    color: var(--text-secondary); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    margin-left: 4px;
    transition: color 0.2s, background 0.2s, border-color 0.2s;
  }
  .theme-toggle:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .theme-toggle svg { width: 16px; height: 16px; }

  /* ── App layout ── */
  .app {
    display: flex; flex-direction: column;
    height: 100vh; padding-top: 64px;
    position: relative; z-index: 1;
  }

  /* ── Chat messages ── */
  .chat-area {
    flex: 1; overflow-y: auto; padding: 28px 20px 120px;
    max-width: 760px; width: 100%; margin: 0 auto;
    scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent;
  }
  .chat-area::-webkit-scrollbar { width: 6px; }
  .chat-area::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

  /* Welcome state */
  .welcome {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: calc(100vh - 240px); text-align: center; padding: 40px 20px;
  }
  .welcome-orb {
    position: relative; width: 96px; height: 96px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 28px;
  }
  .welcome-orb::before {
    content: ''; position: absolute; inset: 0; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent-soft), var(--violet-soft));
    box-shadow: 0 0 60px var(--accent-glow), inset 0 0 24px rgba(56,189,248,0.08);
    border: 1px solid rgba(56,189,248,0.2);
  }
  .welcome-orb::after {
    content: ''; position: absolute; inset: -12px; border-radius: 50%;
    border: 1px solid rgba(56,189,248,0.12);
    animation: welcome-breathe 3s ease-in-out infinite;
  }
  @keyframes welcome-breathe {
    0%, 100% { transform: scale(1); opacity: 0.6; }
    50% { transform: scale(1.08); opacity: 0.2; }
  }
  .welcome-orb svg { position: relative; width: 38px; height: 38px; color: var(--accent); }
  .welcome h2 {
    font-size: 26px; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 10px;
    background: linear-gradient(180deg, var(--text) 0%, var(--text-secondary) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .welcome p {
    font-size: 15px; color: var(--text-muted); max-width: 380px; line-height: 1.65;
  }
  .welcome-hints {
    display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; justify-content: center;
  }
  .welcome-hint {
    font-family: var(--mono); font-size: 12px; color: var(--text-secondary);
    background: var(--surface); border: 1px solid var(--border);
    padding: 8px 16px; border-radius: 999px;
    transition: border-color 0.2s, color 0.2s;
    cursor: default;
  }
  .welcome-hint:hover { border-color: var(--accent); color: var(--accent); }

  /* ── Message group ── */
  .msg-group {
    margin-bottom: 28px; animation: msg-in 0.35s ease;
  }
  .msg-group:last-child { margin-bottom: 12px; }
  @keyframes msg-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .msg-group-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px; padding: 0 2px;
  }
  .msg-group-time {
    font-family: var(--mono); font-size: 10.5px; color: var(--text-dim);
  }
  .msg-group-close {
    background: transparent; border: none; cursor: pointer;
    color: var(--text-dim); padding: 2px 6px; border-radius: 4px;
    font-size: 16px; line-height: 1;
    transition: color 0.15s, background 0.15s;
  }
  .msg-group-close:hover { color: var(--red); background: var(--red-soft); }

  /* Transcript bubble */
  .msg-transcript {
    background: var(--bubble-bg); border: 1px solid var(--border);
    border-radius: var(--radius) var(--radius) var(--radius) 4px;
    padding: 14px 18px; margin-bottom: 14px;
    backdrop-filter: blur(8px);
  }
  .msg-heard {
    font-size: 12.5px; color: var(--red); opacity: 0.75; line-height: 1.5;
  }
  .msg-heard em { font-style: italic; }
  .msg-understood {
    font-size: 13.5px; color: var(--emerald); line-height: 1.5; margin-top: 4px;
  }
  .msg-understood em { font-style: normal; font-weight: 500; }
  .msg-unsupported {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 8px; padding: 4px 12px;
    background: var(--red-soft); border: 1px solid rgba(248,113,113,0.18);
    border-radius: 999px; font-size: 11px; color: var(--red);
  }

  /* Empty result */
  .msg-empty-result {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px 18px;
    font-size: 13.5px; color: var(--text-muted); font-style: italic;
    text-align: center;
  }

  /* File card */
  .file-card {
    border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden; background: var(--card-bg);
    margin-bottom: 12px;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  .file-card:hover { border-color: rgba(56,189,248,0.2); box-shadow: 0 0 30px rgba(56,189,248,0.06); }
  .file-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; background: var(--card-head-bg);
    border-bottom: 1px solid var(--border);
  }
  .file-name {
    display: flex; align-items: center; gap: 10px;
    font-family: var(--mono); font-size: 12.5px; font-weight: 500; color: var(--text-secondary);
  }
  .file-icon {
    width: 18px; height: 18px; border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    font-size: 8.5px; font-weight: 700; font-family: var(--mono);
  }
  .file-icon.docker { background: var(--blue-soft); color: var(--blue); }
  .file-icon.compose { background: var(--emerald-soft); color: var(--emerald); }
  .file-icon.terraform { background: var(--violet-soft); color: var(--violet); }
  .file-badge {
    font-family: var(--mono); font-size: 10px; font-weight: 500;
    padding: 2px 8px; border-radius: 999px; margin-left: 8px;
  }
  .file-badge.pass { background: var(--emerald-soft); color: var(--emerald); }
  .file-badge.fail { background: var(--red-soft); color: var(--red); }
  .file-badge.healed { background: var(--accent-soft); color: var(--accent); }
  .file-badge.na { background: var(--surface-3); color: var(--text-dim); }
  .file-badge.valid { background: var(--emerald-soft); color: var(--emerald); }
  .file-badge.invalid { background: var(--red-soft); color: var(--red); }
  .file-badge.unknown {
    background: var(--surface-3); color: var(--text-dim);
    border: 1px dashed var(--border-strong);
  }
  .file-actions { display: flex; gap: 2px; }
  .file-actions button {
    background: transparent; border: none; color: var(--text-dim);
    cursor: pointer; padding: 5px 7px; border-radius: 6px;
    display: flex; align-items: center; transition: color 0.15s, background 0.15s;
  }
  .file-actions button:hover { color: var(--text-secondary); background: var(--surface-3); }
  .file-actions svg { width: 14px; height: 14px; }
  .file-body {
    padding: 16px 18px; font-family: var(--mono); font-size: 12.5px;
    line-height: 1.8; overflow: auto; white-space: pre;
    counter-reset: line; max-height: 340px;
  }
  .file-body .line { display: block; }
  .file-body .line::before {
    counter-increment: line; content: counter(line);
    display: inline-block; width: 26px; margin-right: 16px;
    text-align: right; color: var(--text-dim); font-size: 11px; user-select: none;
  }
  .tok-kw { color: var(--accent); }
  .tok-key { color: var(--emerald); }
  .tok-str { color: var(--violet); }
  .tok-cmt { color: var(--text-dim); font-style: italic; }
  .tok-plain { color: var(--text-secondary); }

  /* Clear history */
  .clear-history {
    display: none; align-items: center; justify-content: center;
    gap: 6px; padding: 8px 12px; margin: 0 0 0 4px;
    background: transparent; border: none; border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 12px; color: var(--text-dim);
    transition: color 0.15s, background 0.15s;
  }
  .clear-history:hover { color: var(--red); background: var(--red-soft); }
  .clear-history.visible { display: flex; }

  /* ── Input dock ── */
  .input-dock {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    z-index: 40;
    display: flex; align-items: center; gap: 10px;
    padding: 7px 14px 7px 8px;
    background: var(--dock-bg);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--border);
    border-radius: 999px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.12);
    transition: border-color 0.25s, background 0.25s;
  }
  .input-dock:hover { border-color: rgba(56,189,248,0.18); }
  .input-dock.recording { border-color: rgba(56,189,248,0.3); background: var(--dock-recording-bg); }
  #micBtn {
    width: 34px; height: 34px; border-radius: 50%;
    border: none; background: transparent;
    color: var(--accent); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s, transform 0.1s;
    -webkit-tap-highlight-color: transparent; user-select: none;
  }
  #micBtn svg { width: 18px; height: 18px; }
  #micBtn:hover { background: var(--accent-soft); }
  #micBtn:active { transform: scale(0.95); }
  #micBtn.recording {
    background: var(--accent-soft);
    box-shadow: 0 0 0 0 var(--accent-glow);
    animation: mic-pulse 1.5s ease-in-out infinite;
  }
  @keyframes mic-pulse {
    0%, 100% { box-shadow: 0 0 0 0 var(--accent-glow); }
    50% { box-shadow: 0 0 0 10px transparent; }
  }
  .wave-wrap {
    width: 52px; height: 18px;
    display: flex; align-items: center; justify-content: center; gap: 3px;
  }
  .wave-bar {
    width: 3px; border-radius: 2px;
    background: var(--accent);
    opacity: 0.35;
    animation: wave-idle 1.4s ease-in-out infinite;
  }
  .wave-bar:nth-child(1) { height: 6px; animation-delay: 0s; }
  .wave-bar:nth-child(2) { height: 10px; animation-delay: 0.15s; }
  .wave-bar:nth-child(3) { height: 14px; animation-delay: 0.3s; }
  .wave-bar:nth-child(4) { height: 10px; animation-delay: 0.45s; }
  .wave-bar:nth-child(5) { height: 6px; animation-delay: 0.6s; }
  @keyframes wave-idle {
    0%, 100% { transform: scaleY(0.6); opacity: 0.25; }
    50% { transform: scaleY(1); opacity: 0.7; }
  }
  .input-dock.recording .wave-bar { animation-name: wave-active; }
  @keyframes wave-active {
    0%, 100% { transform: scaleY(0.5); opacity: 0.4; }
    50% { transform: scaleY(1.2); opacity: 1; }
  }
  .input-dock.recording .wave-bar.audio-level {
    animation: none;
    transition: transform 0.06s ease-out, opacity 0.06s ease-out;
  }
  /* ── Validation pipeline card (self-healing display) ── */
  .healing-info {
    margin-top: 12px; border-radius: var(--radius);
    border: 1px solid var(--border); background: var(--card-bg);
    overflow: hidden;
  }
  .heal-head {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 16px; background: var(--card-head-bg);
    border-bottom: 1px solid var(--border);
    font-family: var(--mono); font-size: 11.5px; font-weight: 500; color: var(--text-secondary);
  }
  .heal-step {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 16px; font-size: 12.5px; color: var(--text-secondary);
    border-bottom: 1px solid var(--border);
  }
  .heal-step:last-child { border-bottom: none; }
  .heal-ico {
    width: 22px; height: 22px; border-radius: 6px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; font-family: var(--mono);
  }
  .heal-ico.lint { background: var(--emerald-soft); color: var(--emerald); }
  .heal-ico.fix  { background: var(--accent-soft); color: var(--accent); }
  .heal-txt { flex: 1; line-height: 1.5; }
  .heal-txt strong { font-weight: 600; color: var(--text); }
  .heal-tool {
    font-family: var(--mono); font-size: 10.5px; font-weight: 500;
    color: var(--text-dim); background: var(--surface-3);
    padding: 2px 8px; border-radius: 6px; white-space: nowrap;
  }
  .heal-errors {
    padding: 4px 16px 10px 48px;
    display: flex; flex-direction: column; gap: 3px;
  }
  .heal-err {
    font-family: var(--mono); font-size: 11px; line-height: 1.55;
    color: var(--red); opacity: 0.85;
  }
  .heal-err::before { content: '\2022\00a0\00a0'; opacity: 0.5; }
  .heal-fix-note {
    font-size: 11px; color: var(--emerald); font-weight: 500;
    margin-top: 2px; display: flex; align-items: center; gap: 4px;
  }
  .heal-fix-note::before { content: '\2713'; font-weight: 700; }
  .status-text {
    font-size: 12px; font-weight: 500; color: var(--text-muted);
    transition: color 0.25s; white-space: nowrap;
  }
  .status-text.recording { color: var(--accent); }
  .status-text.error { color: var(--red); }
  .status-text.ready { color: var(--emerald); }

  /* ── Processing bubble ── */
  .msg-processing {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 20px; margin-bottom: 16px;
    background: var(--bubble-bg); border: 1px solid var(--border);
    border-radius: var(--radius) var(--radius) var(--radius) 4px;
    backdrop-filter: blur(8px); animation: msg-in 0.3s ease;
  }
  .msg-processing-dots { display: flex; gap: 5px; }
  .msg-processing-dots span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); animation: dot-bounce 1.4s ease-in-out infinite;
  }
  .msg-processing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .msg-processing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dot-bounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }
  .msg-processing-text {
    font-size: 13px; color: var(--text-secondary); font-weight: 500;
  }

  /* ── Timing badge ── */
  .msg-metric {
    font-family: var(--mono); font-size: 10px; font-weight: 500;
    color: var(--emerald); background: var(--emerald-soft);
    padding: 2px 8px; border-radius: 999px; margin-left: 8px;
  }

  /* ── Text input ── */
  .text-input {
    flex: 1; min-width: 0;
    background: var(--input-bg); border: 1px solid var(--border);
    border-radius: 999px;
    padding: 10px 16px; font-family: var(--font);
    font-size: 13px; color: var(--text); outline: none;
    transition: border-color 0.2s;
  }
  .text-input:focus { border-color: var(--accent); }
  .text-input::placeholder { color: var(--text-dim); }
  .text-send-btn {
    flex-shrink: 0; background: var(--accent-soft);
    border: 1px solid rgba(56,189,248,0.2); border-radius: 999px;
    color: var(--accent); padding: 8px 16px; cursor: pointer;
    font-size: 12px; font-weight: 600; font-family: var(--font);
    transition: background 0.15s, border-color 0.15s;
  }
  .text-send-btn:hover { background: rgba(56,189,248,0.22); }
  .text-send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ── Deploy visualization ── */
  .deploy-viz {
    margin-top: 12px; padding: 14px 18px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .deploy-viz-title {
    font-size: 11px; font-weight: 600; color: var(--violet);
    text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px;
  }
  .deploy-flow {
    display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
  }
  .deploy-node {
    padding: 6px 12px; background: var(--violet-soft);
    border: 1px solid rgba(167,139,250,0.18); border-radius: 8px;
    font-family: var(--mono); font-size: 10.5px; color: var(--violet);
  }
  .deploy-arrow { color: var(--text-dim); font-size: 12px; padding: 0 2px; }

  /* ── Export button ── */
  .export-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; margin-top: 10px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 999px; cursor: pointer;
    font-size: 11px; color: var(--text-muted); font-family: var(--font);
    transition: color 0.15s, border-color 0.15s, background 0.15s;
  }
  .export-btn:hover { color: var(--accent); border-color: rgba(56,189,248,0.25); background: var(--accent-soft); }
  .export-btn svg { width: 12px; height: 12px; }

  /* ── Pipeline stages ── */
  .pipeline-stage {
    display: flex; align-items: center; gap: 10px;
    font-size: 12px; color: var(--text-secondary);
    transition: opacity 0.3s ease;
  }
  .pipeline-stage .stage-icon {
    width: 22px; height: 22px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; flex-shrink: 0;
  }
  .pipeline-stage .stage-icon.active { background: var(--accent-soft); color: var(--accent); }
  .pipeline-stage .stage-icon.done { background: var(--emerald-soft); color: var(--emerald); }
  .pipeline-stage .stage-icon.pending { background: var(--surface-3); color: var(--text-dim); }

  /* ── Responsive ── */
  @media (max-width: 640px) {
    .nav { padding: 0 20px; height: 60px; }
    .nav-tag { display: none; }
    .chat-area { padding: 20px 16px 110px; }
    .input-dock { bottom: 14px; padding: 6px 12px 6px 6px; }
    #micBtn { width: 32px; height: 32px; }
    #micBtn svg { width: 17px; height: 17px; }
    .wave-wrap { width: 44px; }
    .status-text { font-size: 11px; }
    .welcome h2 { font-size: 22px; }
  }
</style>
</head>
<body>

<div class="bg-orb"></div>
<div class="bg-grid"></div>
<div class="bg-noise"></div>

<!-- Navigation -->
<nav class="nav">
  <a href="/" class="nav-brand">
    <div class="nav-logo">
      <svg viewBox="0 0 24 24" fill="none">
        <rect x="4" y="14" width="16" height="5.5" rx="1.5" fill="var(--logo-icon)"/>
        <rect x="6" y="8.5" width="12" height="5" rx="1.5" fill="var(--logo-icon)"/>
        <rect x="8" y="3.5" width="8" height="4.5" rx="1.5" fill="var(--logo-icon)"/>
      </svg>
    </div>
    <span class="nav-name">VoicOps</span>
  </a>
  <div class="nav-links">
    <a href="/" class="nav-link">Home</a>
    <a href="/generate" class="nav-link active">Generate</a>
    <a href="/analytics" class="nav-link">Analytics</a>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>
  </div>
</nav>

<!-- App layout -->
<div class="app">
  <div class="chat-area" id="chatArea">
    <div class="welcome" id="welcome">
      <div class="welcome-orb">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </div>
      <h2>Speak to generate</h2>
      <p>Hold the mic button and describe the infrastructure you need. VoicOps will handle the rest.</p>
      <div class="welcome-hints">
        <span class="welcome-hint">"Node.js with Redis"</span>
        <span class="welcome-hint">"Flask and PostgreSQL"</span>
        <span class="welcome-hint">"Django with MySQL"</span>
      </div>
    </div>
  </div>
</div>

<!-- Floating input dock -->
<div class="input-dock" id="inputDock">
  <button id="micBtn" aria-label="Hold to record">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
      <line x1="12" y1="19" x2="12" y2="23"></line>
      <line x1="8" y1="23" x2="16" y2="23"></line>
    </svg>
  </button>
  <div class="wave-wrap" id="waveWrap">
    <span class="wave-bar"></span><span class="wave-bar"></span><span class="wave-bar"></span><span class="wave-bar"></span><span class="wave-bar"></span>
  </div>
  <input type="text" id="textInput" class="text-input" placeholder="Or type your stack..." style="display:none;">
  <button id="textSendBtn" class="text-send-btn" style="display:none;">Send</button>
  <div class="status-text" id="status">Hold to record</div>
  <button id="clearHistory" class="clear-history" onclick="clearHistory()">Clear</button>
</div>

<script>
  const micBtn = document.getElementById('micBtn');
  const statusEl = document.getElementById('status');
  const inputDock = document.getElementById('inputDock');
  const chatArea = document.getElementById('chatArea');
  const welcomeEl = document.getElementById('welcome');
  const clearHistoryBtn = document.getElementById('clearHistory');
  const textInput = document.getElementById('textInput');
  const textSendBtn = document.getElementById('textSendBtn');
  const themeToggle = document.getElementById('themeToggle');

  // ── Theme toggle ──
  const THEME_KEY = 'voicops_theme';
  function applyTheme(theme) {
    if (theme === 'light') { document.body.classList.add('light-theme'); }
    else { document.body.classList.remove('light-theme'); }
    updateThemeIcon(theme);
  }
  function updateThemeIcon(theme) {
    if (!themeToggle) return;
    themeToggle.querySelector('.moon').style.display = theme === 'light' ? 'none' : 'block';
    themeToggle.querySelector('.sun').style.display = theme === 'light' ? 'block' : 'none';
  }
  function toggleTheme() {
    var isLight = document.body.classList.toggle('light-theme');
    var theme = isLight ? 'light' : 'dark';
    try { localStorage.setItem(THEME_KEY, theme); } catch(e) {}
    updateThemeIcon(theme);
  }
  try { applyTheme(localStorage.getItem(THEME_KEY) || 'dark'); } catch(e) { applyTheme('dark'); }
  if (themeToggle) themeToggle.addEventListener('click', toggleTheme);

  let mediaRecorder, audioChunks = [];
  let audioCtx, analyser, dataArray, stream;
  let spaceHeld = false;
  let isRecording = false;
  let recordingStartTime = 0;
  let animFrameId = null;
  const STORAGE_KEY = 'voicops_chat_history';
  let chatHistory = [];

  // ── Processing bubble ──
  let processingEl = null;
  function showProcessing(text) {
    hideProcessing();
    processingEl = document.createElement('div');
    processingEl.className = 'msg-processing';
    processingEl.innerHTML = '<div class="msg-processing-dots"><span></span><span></span><span></span></div><div class="msg-processing-text">' + (text || 'Generating configs...') + '</div>';
    chatArea.appendChild(processingEl);
    scrollToBottom();
  }
  function hideProcessing() {
    if (processingEl) { processingEl.remove(); processingEl = null; }
  }

  // ── Success sound (Web Audio API) ──
  function playSuccess() {
    try {
      var ac = new (window.AudioContext || window.webkitAudioContext)();
      var now = ac.currentTime;
      // Soft chime: C5 + E5 + G5
      var notes = [523.25, 659.25, 783.99];
      notes.forEach(function(freq, i) {
        var osc = ac.createOscillator();
        var gain = ac.createGain();
        osc.connect(gain); gain.connect(ac.destination);
        osc.type = 'sine'; osc.frequency.value = freq;
        var t = now + i * 0.04;
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.08, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
        osc.start(t); osc.stop(t + 0.4);
      });
      setTimeout(function() { ac.close(); }, 600);
    } catch(e) {}
  }

  // ── Show/hide text input (error recovery) ──
  function showTextInput() {
    textInput.style.display = 'block';
    textSendBtn.style.display = 'block';
    textInput.focus();
  }
  function hideTextInput() {
    textInput.style.display = 'none';
    textSendBtn.style.display = 'none';
    textInput.value = '';
  }

  // ── Export summary as markdown ──
  function exportSummary(msg) {
    var md = '# VoicOps Generated Config\n\n';
    md += '_Generated at ' + (msg.timestamp || new Date().toLocaleTimeString()) + '_\n\n';
    var rawT = (msg.transcript || '').trim();
    var corrT = (msg.corrected_transcript || '').trim();
    if (rawT) { md += '## Transcript\n- **Heard:** "' + rawT + '"\n- **Understood:** "' + (corrT || rawT) + '"\n\n'; }
    if (msg.dockerfile) md += '## Dockerfile\n```dockerfile\n' + msg.dockerfile + '\n```\n\n';
    if (msg.docker_compose) md += '## docker-compose.yml\n```yaml\n' + msg.docker_compose + '\n```\n\n';
    if (msg.terraform) md += '## main.tf (Alibaba Cloud)\n```hcl\n' + msg.terraform + '\n```\n\n';
    if (msg.time_taken) md += '_Generated in ' + msg.time_taken + 's_\n';
    var blob = new Blob([md], { type: 'text/markdown' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a'); a.href = url; a.download = 'voicops-config.md'; a.click();
    URL.revokeObjectURL(url);
  }

  // ── Deploy visualization ──
  function renderDeployViz(group, msg) {
    if (!msg.terraform) return;
    var viz = document.createElement('div');
    viz.className = 'deploy-viz';
    var services = [];
    try {
      var tfText = msg.terraform;
      if (tfText.indexOf('alicloud_vpc') >= 0) services.push('VPC');
      if (tfText.indexOf('alicloud_vswitch') >= 0) services.push('VSwitch');
      if (tfText.indexOf('alicloud_security_group') >= 0) services.push('Security Group');
      if (tfText.indexOf('alicloud_instance') >= 0) services.push('ECS Instance');
      if (tfText.indexOf('alicloud_disk') >= 0) services.push('Cloud Disk');
    } catch(e) {}
    if (services.length === 0) return;
    var html = '<div class="deploy-viz-title">Alibaba Cloud Architecture</div><div class="deploy-flow">';
    services.forEach(function(s, i) {
      if (i > 0) html += '<span class="deploy-arrow">\u2192</span>';
      html += '<span class="deploy-node">' + s + '</span>';
    });
    html += '</div>';
    viz.innerHTML = html;
    group.appendChild(viz);
  }

  // ── Persistence ──
  function saveHistory() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(chatHistory)); } catch(e) {}
    clearHistoryBtn.classList.toggle('visible', chatHistory.length > 0);
  }
  function restoreHistory() {
    try { chatHistory = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch(e) { chatHistory = []; }
    if (chatHistory.length > 0) {
      welcomeEl.style.display = 'none';
      chatHistory.forEach(function(msg) { renderMessage(msg, false); });
      scrollToBottom();
    }
    clearHistoryBtn.classList.toggle('visible', chatHistory.length > 0);
  }
  function clearHistory() {
    chatHistory = []; chatArea.innerHTML = '';
    chatArea.appendChild(welcomeEl); welcomeEl.style.display = 'flex';
    saveHistory();
  }
  function removeMessage(msg) {
    var idx = chatHistory.indexOf(msg);
    if (idx >= 0) chatHistory.splice(idx, 1);
    rebuildChat(); saveHistory();
  }
  function rebuildChat() {
    chatArea.innerHTML = '';
    if (chatHistory.length === 0) { chatArea.appendChild(welcomeEl); welcomeEl.style.display = 'flex'; }
    else { welcomeEl.style.display = 'none'; chatHistory.forEach(function(m) { renderMessage(m, false); }); scrollToBottom(); }
  }
  function scrollToBottom() { requestAnimationFrame(function() { chatArea.scrollTop = chatArea.scrollHeight; }); }

  function setStatus(t, c) {
    statusEl.textContent = t; statusEl.className = 'status-text' + (c ? ' ' + c : '');
    if (c === 'recording') { inputDock.classList.add('recording'); }
    else { inputDock.classList.remove('recording'); }
  }
  function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // ── Syntax highlighters ──
  function highlightDockerfile(t) {
    var kws=['FROM','WORKDIR','COPY','RUN','EXPOSE','CMD','ENV','ENTRYPOINT','ARG','LABEL','ADD','VOLUME','USER','SHELL'];
    return escapeHtml(t).split('\n').map(function(l){var m=l.match(/^([A-Z]+)(\s.*)?$/);if(m&&kws.indexOf(m[1])>=0)return'<span class="tok-kw">'+m[1]+'</span><span class="tok-plain">'+(m[2]||'')+'</span>';return'<span class="tok-plain">'+l+'</span>';}).map(function(l){return'<span class="line">'+l+'</span>';}).join('');
  }
  function highlightYaml(t) {
    return escapeHtml(t).split('\n').map(function(l){var m=l.match(/^(\s*)([\w."'-]+):(.*)$/);if(m)return m[1]+'<span class="tok-key">'+m[2]+'</span>:<span class="tok-plain">'+m[3]+'</span>';if(/^\s*-\s/.test(l))return'<span class="tok-str">'+l+'</span>';if(/^\s*#/.test(l))return'<span class="tok-cmt">'+l+'</span>';return'<span class="tok-plain">'+l+'</span>';}).map(function(l){return'<span class="line">'+l+'</span>';}).join('');
  }
  function highlightHCL(t) {
    var kws=['resource','variable','provider','data','output','module','locals','terraform'];
    return escapeHtml(t).split('\n').map(function(l){if(/^\s*#/.test(l))return'<span class="tok-cmt">'+l+'</span>';var bm=l.match(/^(\s*)(resource|variable|provider|data|output|module|locals|terraform)(\s.*)?$/);if(bm&&kws.indexOf(bm[2])>=0)return bm[1]+'<span class="tok-kw">'+bm[2]+'</span><span class="tok-plain">'+(bm[3]||'')+'</span>';var am=l.match(/^(\s*)([\w.]+)(\s*=\s*)(.*)?$/);if(am){var v=am[4]||'';var vc=/"/.test(v)?'tok-str':'tok-plain';return am[1]+'<span class="tok-key">'+am[2]+'</span>'+am[3]+'<span class="'+vc+'">'+v+'</span>';}return'<span class="tok-plain">'+l+'</span>';}).map(function(l){return'<span class="line">'+l+'</span>';}).join('');
  }

  // ── Validation badge (4 states: valid / invalid / unchecked / hidden) ──
  function validationBadgeHtml(validation) {
    if (!validation || !('tool_available' in validation)) return '';
    if (validation.valid === true) {
      return '<span class="file-badge valid">\u2713 Validated</span>';
    }
    if (validation.valid === false) {
      var errors = validation.errors || [];
      var tip = errors.map(escapeHtml).join('\n');
      return '<span class="file-badge invalid" title="' + tip + '">' + errors.length + ' issue' + (errors.length !== 1 ? 's' : '') + '</span>';
    }
    // valid === null or undefined — validator could not complete
    return '<span class="file-badge unknown">Unchecked</span>';
  }

  // ── Render message group (transcript bubble + file cards) ──
  function renderMessage(msg, animate) {
    if (animate === undefined) animate = true;
    var group = document.createElement('div');
    group.className = 'msg-group';
    if (!animate) group.style.animation = 'none';
    var time = msg.timestamp || '';
    var rawT = (msg.transcript || '').trim();
    var corrT = (msg.corrected_transcript || '').trim();
    var v = msg.validation || {};

    // Group header with timestamp + close
    var headEl = document.createElement('div');
    headEl.className = 'msg-group-head';
    headEl.innerHTML = '<span class="msg-group-time">' + time + (msg.time_taken ? '<span class="msg-metric">' + msg.time_taken + 's</span>' : '') + '</span><button class="msg-group-close" title="Remove this turn">\u00d7</button>';
    headEl.querySelector('.msg-group-close').addEventListener('click', function() { removeMessage(msg); });
    group.appendChild(headEl);

    // Transcript bubble (Heard + Understood)
    if (rawT) {
      var tEl = document.createElement('div');
      tEl.className = 'msg-transcript';
      var tH = '<div class="msg-heard">Heard: <em>"' + escapeHtml(rawT) + '"</em></div>';
      tH += '<div class="msg-understood">Understood: <em>"' + escapeHtml(corrT || rawT) + '"</em></div>';
      if (msg.unsupported && msg.unsupported.length) {
        tH += '<div class="msg-unsupported">Not supported: ' + msg.unsupported.map(escapeHtml).join(', ') + '</div>';
      }
      tEl.innerHTML = tH;
      group.appendChild(tEl);
    }

    // File data
    var fd = [];
    if (!!msg.dockerfile) fd.push({c:'docker',l:'D',n:'Dockerfile',x:msg.dockerfile,h:'df',v:v.dockerfile});
    if (!!msg.docker_compose) fd.push({c:'compose',l:'C',n:'docker-compose.yml',x:msg.docker_compose,h:'yaml',v:v.compose});
    if (!!msg.terraform) fd.push({c:'terraform',l:'T',n:'main.tf',x:msg.terraform,h:'hcl',v:v.terraform});

    if (fd.length > 0) {
      fd.forEach(function(f, i) {
        var vBadge = validationBadgeHtml(f.v);
        var hlFn = f.h === 'df' ? highlightDockerfile : f.h === 'yaml' ? highlightYaml : highlightHCL;
        var card = document.createElement('div');
        card.className = 'file-card';
        card.innerHTML = '<div class="file-head"><div class="file-name"><span class="file-icon ' + f.c + '">' + f.l + '</span>' + f.n + vBadge + '</div><div class="file-actions"><button class="copy-btn" title="Copy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button><button class="dl-btn" title="Download"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button></div></div><div class="file-body">' + hlFn(f.x) + '</div>';
        card.querySelector('.copy-btn').addEventListener('click', function(e) {
          var btn = e.currentTarget;
          navigator.clipboard.writeText(f.x);
          btn.textContent = '\u2713';
          setTimeout(function() { btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>'; }, 1200);
        });
        card.querySelector('.dl-btn').addEventListener('click', function() {
          var blob = new Blob([f.x], { type: 'text/plain' });
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a'); a.href = url; a.download = f.n; a.click();
          URL.revokeObjectURL(url);
        });
        group.appendChild(card);
      });
      // Deploy visualization
      renderDeployViz(group, msg);
      // Self-healing pipeline card — the VoicOps differentiator
      var vData = msg.validation || {};
      var healFiles = [];
      if (vData.dockerfile && vData.dockerfile.tool_available) {
        healFiles.push({name:'Dockerfile', v:vData.dockerfile, tool:'hadolint'});
      }
      if (vData.compose && vData.compose.tool_available) {
        healFiles.push({name:'docker-compose.yml', v:vData.compose, tool:'yamllint'});
      }
      if (vData.terraform && vData.terraform.tool_available) {
        healFiles.push({name:'main.tf', v:vData.terraform, tool:'terraform validate'});
      }
      if (healFiles.length > 0) {
        var healEl = document.createElement('div');
        healEl.className = 'healing-info';
        var hH = '<div class="heal-head">';
        hH += '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>';
        hH += 'Validation Pipeline</div>';
        healFiles.forEach(function(f) {
          var rawErrs = f.v.original_errors || [];
          var errs = rawErrs.filter(function(e) { return e && e.trim().length > 0; });
          var hadIssues = errs.length > 0;
          var couldNotValidate = f.v.valid === null || f.v.valid === undefined;
          var healed = hadIssues && f.v.valid === true;
          var unhealed = hadIssues && f.v.valid === false;
          hH += '<div class="heal-step">';
          if (healed) {
            hH += '<span class="heal-ico fix">\u21BB</span>';
            hH += '<span class="heal-txt"><strong>' + f.name + '</strong> &mdash; ' + errs.length + ' issue' + (errs.length !== 1 ? 's' : '') + ' found and auto-fixed</span>';
          } else if (unhealed) {
            hH += '<span class="heal-ico fix" style="background:var(--red-soft);color:var(--red)">\u26A0</span>';
            hH += '<span class="heal-txt"><strong>' + f.name + '</strong> &mdash; ' + errs.length + ' issue' + (errs.length !== 1 ? 's' : '') + ' found, could not fully fix</span>';
          } else if (couldNotValidate) {
            hH += '<span class="heal-ico fix" style="background:var(--red-soft);color:var(--red)">\u26A0</span>';
            hH += '<span class="heal-txt"><strong>' + f.name + '</strong> &mdash; validation could not be completed</span>';
          } else {
            hH += '<span class="heal-ico lint">\u2713</span>';
            hH += '<span class="heal-txt"><strong>' + f.name + '</strong> &mdash; passed validation, no issues found</span>';
          }
          hH += '<span class="heal-tool">' + f.tool + '</span>';
          hH += '</div>';
          if (hadIssues) {
            hH += '<div class="heal-errors">';
            errs.forEach(function(e) { hH += '<div class="heal-err">' + escapeHtml(e) + '</div>'; });
            if (healed) hH += '<div class="heal-fix-note">All issues resolved by AI self-healing</div>';
            else if (couldNotValidate) hH += '<div class="heal-err" style="color:var(--text-secondary)">The validator encountered an error. The file is still provided for export.</div>';
            hH += '</div>';
          } else if (couldNotValidate) {
            hH += '<div class="heal-errors"><div class="heal-err" style="color:var(--text-secondary)">Validator did not return details. The file is still provided for export.</div></div>';
          }
        });
        healEl.innerHTML = hH;
        group.appendChild(healEl);
      }
      // Export button
      var expBtn = document.createElement('button');
      expBtn.className = 'export-btn';
      expBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><polyline points="9 15 12 18 15 15"/></svg>Export as Markdown';
      expBtn.addEventListener('click', function() { exportSummary(msg); });
      group.appendChild(expBtn);
    } else {
      var emptyEl = document.createElement('div');
      emptyEl.className = 'msg-empty-result';
      emptyEl.textContent = 'No services detected \u2014 try a clearer voice command.';
      group.appendChild(emptyEl);
    }

    chatArea.appendChild(group);
    if (animate) scrollToBottom();
    return group;
  }

  // ── WebM to WAV ──
  async function webmToWav(webmBlob) {
    var ab = await webmBlob.arrayBuffer();
    var ac = new (window.AudioContext || window.webkitAudioContext)();
    var buf = await ac.decodeAudioData(ab); ac.close();
    var ch=buf.numberOfChannels, sr=buf.sampleRate, len=buf.length;
    var wb=new ArrayBuffer(44+len*ch*2), dv=new DataView(wb);
    function ws(o,s){for(var i=0;i<s.length;i++)dv.setUint8(o+i,s.charCodeAt(i));}
    ws(0,'RIFF');dv.setUint32(4,36+len*ch*2,true);ws(8,'WAVE');ws(12,'fmt ');
    dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,ch,true);
    dv.setUint32(24,sr,true);dv.setUint32(28,sr*ch*2,true);dv.setUint16(32,ch*2,true);
    dv.setUint16(34,16,true);ws(36,'data');dv.setUint32(40,len*ch*2,true);
    var channels=[];for(var c=0;c<ch;c++)channels.push(buf.getChannelData(c));
    var off=44;for(var i=0;i<len;i++)for(var c=0;c<ch;c++){var s=Math.max(-1,Math.min(1,channels[c][i]));dv.setInt16(off,s<0?s*0x8000:s*0x7FFF,true);off+=2;}
    return {blob:new Blob([wb],{type:'audio/wav'}),duration:len/sr};
  }

  // ── Recording ──
  async function startRecording(){
    if(isRecording) return;          // prevent double-start (race condition guard)
    isRecording = true;
    recordingStartTime = Date.now();
    try{
      stream=await navigator.mediaDevices.getUserMedia({audio:true});
      audioCtx=new(window.AudioContext||window.webkitAudioContext)();
      var src=audioCtx.createMediaStreamSource(stream);
      analyser=audioCtx.createAnalyser(); analyser.fftSize=128;
      dataArray=new Uint8Array(analyser.frequencyBinCount);
      src.connect(analyser);
      mediaRecorder=new MediaRecorder(stream); audioChunks=[];
      mediaRecorder.ondataavailable=function(e){if(e.data&&e.data.size>0)audioChunks.push(e.data);};
      mediaRecorder.onstop=async function(){
        var elapsed=Date.now()-recordingStartTime;
        isRecording=false;
        // Stop the live audio-level visualizer
        if(animFrameId){cancelAnimationFrame(animFrameId);animFrameId=null;}
        document.querySelectorAll('.wave-bar').forEach(function(b){b.classList.remove('audio-level');b.style.transform='';b.style.opacity='';});
        // Min-duration guard: catches quick taps that produce <500ms of audio
        if(elapsed<500||audioChunks.length===0){setStatus('Too short \u2014 hold longer','error');micBtn.classList.remove('recording','processing');return;}
        var wb=new Blob(audioChunks,{type:'audio/webm'});
        stream.getTracks().forEach(function(t){t.stop();});
        try{audioCtx.close();}catch(e){}
        var r=await webmToWav(wb);
        if(r.duration<0.5){setStatus('Too short \u2014 hold longer','error');micBtn.classList.remove('recording','processing');return;}
        await sendAudio(r.blob);
      };
      mediaRecorder.start();
      micBtn.classList.add('recording'); setStatus('Listening...','recording');
      // Live audio-level visualizer — drives wave bars from real mic input
      var bars=document.querySelectorAll('.wave-bar');
      (function drawLevel(){
        if(!isRecording)return;
        analyser.getByteFrequencyData(dataArray);
        var sum=0;for(var i=0;i<dataArray.length;i++)sum+=dataArray[i];
        var avg=sum/dataArray.length/255;
        bars.forEach(function(bar,idx){
          bar.classList.add('audio-level');
          var scale=0.3+avg*(1.2+idx*0.15);
          bar.style.transform='scaleY('+Math.min(scale,1.5).toFixed(2)+')';
          bar.style.opacity=(0.3+avg*0.7).toFixed(2);
        });
        animFrameId=requestAnimationFrame(drawLevel);
      })();
    }catch(e){isRecording=false;setStatus('Microphone access denied','error');}
  }
  function stopRecording(){
    if(!isRecording)return;                       // already stopped or never started
    micBtn.classList.remove('recording');
    micBtn.classList.add('processing');
    setStatus('Processing...','');
    // Min-time guard: if user released before 500ms, warn immediately
    var elapsed=Date.now()-recordingStartTime;
    if(elapsed<500){
      isRecording=false;
      if(mediaRecorder&&mediaRecorder.state!=='inactive'){try{mediaRecorder.stop();}catch(e){}}
      setStatus('Too short \u2014 hold longer','error');
      return;
    }
    if(mediaRecorder&&mediaRecorder.state!=='inactive'){
      try{mediaRecorder.stop();}catch(e){isRecording=false;}
    }else{isRecording=false;}
  }

  async function sendAudio(audioBlob){
    var fd=new FormData(); fd.append('audio',audioBlob,'command.wav');
    // Pipeline stage visualization — cycle through steps while server processes
    showProcessing('Transcribing voice...');
    setStatus('Transcribing...','');
    var stageIdx=0;
    var stages=['Transcribing voice...','Extracting intent...','Generating & validating configs...'];
    var stageTimers=[];
    stageTimers.push(setTimeout(function(){stageIdx=1;showProcessing(stages[1]);setStatus('Extracting intent...','');},1200));
    stageTimers.push(setTimeout(function(){stageIdx=2;showProcessing(stages[2]);setStatus('Generating configs...','');},3200));
    try{
      var res=await fetch('/generate-config',{method:'POST',body:fd});
      stageTimers.forEach(clearTimeout);
      hideProcessing();
      micBtn.classList.remove('processing');
      if(!res.ok){
        if(res.status===502||res.status===503){setStatus('Service busy \u2014 try typing below','error');showTextInput();textInput.setAttribute('placeholder','Type what you said...');return;}
        throw new Error('Failed ('+res.status+')');
      }
      var data=await res.json();
      var msg={timestamp:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'}),transcript:data.transcript||'',corrected_transcript:data.corrected_transcript||'',unsupported:data.unsupported||[],dockerfile:data.dockerfile||null,docker_compose:data.docker_compose||null,terraform:data.terraform||null,validation:data.validation||{},healing_stats:data.healing_stats||{},time_taken:data.time_taken||null};
      if(data.dockerfile||data.docker_compose||data.terraform){
        var parts=[];
        if(data.dockerfile||data.docker_compose)parts.push('Docker');
        if(data.terraform)parts.push('Terraform');
        setStatus(parts.join(' + ')+' generated','ready');
        playSuccess();
      }else{setStatus('No service name detected');}
      welcomeEl.style.display='none';
      chatHistory.push(msg); renderMessage(msg); saveHistory();
    }catch(e){stageTimers.forEach(clearTimeout);hideProcessing();micBtn.classList.remove('processing');setStatus(e.message,'error');showTextInput();textInput.setAttribute('placeholder','Type what you said...');}
  }

  // ── Text input send ──
  async function sendText(){
    var text=textInput.value.trim();
    if(!text)return;
    textSendBtn.disabled=true;
    showProcessing('Generating configs for "'+escapeHtml(text)+'"...');
    setStatus('Generating...','');
    try{
      var fd=new FormData(); fd.append('text',text);
      var res=await fetch('/generate-text',{method:'POST',body:fd});
      hideProcessing();
      textSendBtn.disabled=false;
      if(!res.ok)throw new Error('Failed ('+res.status+')');
      var data=await res.json();
      var msg={timestamp:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'}),transcript:text,corrected_transcript:data.corrected_transcript||'',unsupported:data.unsupported||[],dockerfile:data.dockerfile||null,docker_compose:data.docker_compose||null,terraform:data.terraform||null,validation:data.validation||{},time_taken:data.time_taken||null};
      if(data.dockerfile||data.docker_compose||data.terraform){
        var parts=[];
        if(data.dockerfile||data.docker_compose)parts.push('Docker');
        if(data.terraform)parts.push('Terraform');
        setStatus(parts.join(' + ')+' generated','ready');
        playSuccess();
      }else{setStatus('No service name detected');}
      welcomeEl.style.display='none';
      chatHistory.push(msg); renderMessage(msg); saveHistory();
      textInput.value='';
    }catch(e){hideProcessing();textSendBtn.disabled=false;setStatus(e.message,'error');}
  }
  textSendBtn.addEventListener('click',sendText);
  textInput.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendText();}});

  // ── Keyboard shortcut: Space to record ──
  document.addEventListener('keydown',function(e){
    if(e.code==='Space'&&!spaceHeld&&document.activeElement!==textInput&&!e.repeat){
      e.preventDefault(); spaceHeld=true; startRecording();
    }
    if(e.key==='Escape'){hideTextInput();}
  });
  document.addEventListener('keyup',function(e){
    if(e.code==='Space'&&spaceHeld){
      e.preventDefault(); spaceHeld=false; stopRecording();
    }
  });

  micBtn.addEventListener('mousedown',function(){if(!isRecording)startRecording();});
  micBtn.addEventListener('mouseup',function(){if(isRecording)stopRecording();});
  micBtn.addEventListener('mouseleave',function(){if(isRecording)stopRecording();});
  micBtn.addEventListener('touchstart',function(e){e.preventDefault();if(!isRecording)startRecording();});
  micBtn.addEventListener('touchend',function(e){e.preventDefault();if(isRecording)stopRecording();});

  // ── Demo mode (auto-trigger from URL param) ──
  var demoPrompt = new URLSearchParams(window.location.search).get('demo');
  if(demoPrompt){
    textInput.value=demoPrompt;
    setTimeout(function(){sendText();},600);
  }

  restoreHistory();
</script>
