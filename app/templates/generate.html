<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoicOps — Generate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #09090b;
    --surface: #111113;
    --surface-2: #18181b;
    --surface-3: #1e1e22;
    --border: #27272a;
    --border-subtle: #1e1e22;
    --text: #fafafa;
    --text-secondary: #a1a1aa;
    --text-muted: #52525b;
    --text-dim: #3f3f46;
    --accent: #f59e0b;
    --accent-soft: rgba(245, 158, 11, 0.1);
    --accent-glow: rgba(245, 158, 11, 0.15);
    --emerald: #10b981;
    --emerald-soft: rgba(16, 185, 129, 0.1);
    --blue: #3b82f6;
    --blue-soft: rgba(59, 130, 246, 0.1);
    --violet: #8b5cf6;
    --violet-soft: rgba(139, 92, 246, 0.08);
    --red: #ef4444;
    --red-soft: rgba(239, 68, 68, 0.1);
    --radius: 12px;
    --radius-lg: 16px;
    --radius-sm: 8px;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    --mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--font); height: 100vh; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .bg-mesh {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 60% 50% at 20% 10%, rgba(245,158,11,0.04) 0%, transparent 60%),
      radial-gradient(ellipse 50% 40% at 80% 20%, rgba(139,92,246,0.03) 0%, transparent 60%),
      radial-gradient(ellipse 70% 50% at 50% 90%, rgba(59,130,246,0.03) 0%, transparent 60%);
  }

  /* ── Navigation ── */
  .nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px; height: 56px;
    background: rgba(9,9,11,0.9);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-subtle);
  }
  .nav-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); }
  .nav-logo {
    width: 28px; height: 28px; border-radius: 7px;
    background: linear-gradient(135deg, var(--accent), #d97706);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 20px var(--accent-glow);
  }
  .nav-logo svg { width: 16px; height: 16px; }
  .nav-name { font-weight: 600; font-size: 15px; letter-spacing: -0.02em; }
  .nav-tag {
    font-family: var(--mono); font-size: 10px; font-weight: 500;
    color: var(--text-muted); background: var(--surface-2);
    padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); margin-left: 4px;
  }
  .nav-links { display: flex; align-items: center; gap: 4px; }
  .nav-link {
    font-size: 13px; font-weight: 500; color: var(--text-secondary);
    text-decoration: none; padding: 6px 12px; border-radius: var(--radius-sm);
    transition: color 0.15s, background 0.15s;
  }
  .nav-link:hover { color: var(--text); background: var(--surface-2); }
  .nav-link.active { color: var(--text); background: var(--surface-2); }

  /* ── App layout ── */
  .app {
    display: flex; flex-direction: column;
    height: 100vh; padding-top: 56px;
    position: relative; z-index: 1;
  }

  /* ── Chat messages ── */
  .chat-area {
    flex: 1; overflow-y: auto; padding: 24px 20px;
    max-width: 680px; width: 100%; margin: 0 auto;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  }
  .chat-area::-webkit-scrollbar { width: 6px; }
  .chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* Welcome state */
  .welcome {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; height: 100%; text-align: center; padding: 40px 20px;
  }
  .welcome-icon {
    width: 64px; height: 64px; border-radius: 50%;
    background: var(--surface-2); border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 20px;
  }
  .welcome-icon svg { width: 28px; height: 28px; color: var(--text-muted); }
  .welcome h2 {
    font-size: 20px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 8px;
  }
  .welcome p {
    font-size: 14px; color: var(--text-muted); max-width: 360px; line-height: 1.6;
  }
  .welcome-hints {
    display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; justify-content: center;
  }
  .welcome-hint {
    font-family: var(--mono); font-size: 11.5px; color: var(--text-dim);
    background: var(--surface-2); border: 1px solid var(--border);
    padding: 6px 14px; border-radius: 20px;
  }

  /* Chat message */
  .chat-msg {
    margin-bottom: 16px; animation: msg-in 0.3s ease;
  }
  @keyframes msg-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .msg-time {
    font-family: var(--mono); font-size: 10.5px; color: var(--text-dim);
    margin-bottom: 6px; padding-left: 2px;
  }
  .msg-head {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;
  }
  .msg-close {
    background: transparent; border: none; cursor: pointer;
    color: var(--text-dim); padding: 2px 6px; border-radius: 4px;
    font-size: 16px; line-height: 1;
    transition: color 0.15s, background 0.15s;
  }
  .msg-close:hover { color: var(--red); background: var(--red-soft); }

  /* Transcript section */
  .msg-transcript {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 12px 16px; margin-bottom: 10px;
  }
  .msg-heard {
    font-size: 12.5px; color: var(--red); opacity: 0.75; line-height: 1.5;
  }
  .msg-heard em { font-style: italic; }
  .msg-understood {
    font-size: 13px; color: var(--emerald); line-height: 1.5; margin-top: 4px;
  }
  .msg-understood em { font-style: normal; font-weight: 500; }
  .msg-unsupported {
    display: inline-flex; align-items: center; gap: 5px;
    margin-top: 8px; padding: 3px 10px;
    background: var(--red-soft); border: 1px solid rgba(239,68,68,0.15);
    border-radius: 999px; font-size: 11px; color: var(--red);
  }

  /* Files section */
  .msg-files {
    display: flex; flex-direction: column; gap: 10px;
  }
  .msg-empty-result {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px;
    font-size: 13px; color: var(--text-muted); font-style: italic;
    text-align: center;
  }

  /* File card */
  .file-card {
    border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden; background: var(--bg);
  }
  .file-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px; background: var(--surface-2);
    border-bottom: 1px solid var(--border-subtle);
  }
  .file-name {
    display: flex; align-items: center; gap: 8px;
    font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--text-secondary);
  }
  .file-icon {
    width: 16px; height: 16px; border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 8px; font-weight: 700; font-family: var(--mono);
  }
  .file-icon.docker { background: var(--blue-soft); color: var(--blue); }
  .file-icon.compose { background: var(--emerald-soft); color: var(--emerald); }
  .file-icon.terraform { background: var(--violet-soft); color: var(--violet); }
  .file-badge {
    font-family: var(--mono); font-size: 10px; font-weight: 500;
    padding: 2px 8px; border-radius: 999px; margin-left: 8px;
  }
  .file-badge.pass { background: var(--emerald-soft); color: var(--emerald); }
  .file-badge.fail { background: var(--red-soft); color: var(--red); }
  .file-badge.healed { background: var(--accent-soft); color: var(--accent); }
  .file-badge.na { background: var(--surface-3); color: var(--text-dim); }
  .file-actions { display: flex; gap: 2px; }
  .file-actions button {
    background: transparent; border: none; color: var(--text-dim);
    cursor: pointer; padding: 4px 6px; border-radius: 6px;
    display: flex; align-items: center; transition: color 0.15s, background 0.15s;
  }
  .file-actions button:hover { color: var(--text-secondary); background: var(--surface-3); }
  .file-actions svg { width: 13px; height: 13px; }
  .file-body {
    padding: 14px 16px; font-family: var(--mono); font-size: 12px;
    line-height: 1.75; overflow: auto; white-space: pre;
    counter-reset: line; max-height: 320px;
  }
  .file-body .line { display: block; }
  .file-body .line::before {
    counter-increment: line; content: counter(line);
    display: inline-block; width: 24px; margin-right: 16px;
    text-align: right; color: var(--text-dim); font-size: 11px; user-select: none;
  }
  .tok-kw { color: var(--blue); }
  .tok-key { color: var(--emerald); }
  .tok-str { color: var(--accent); }
  .tok-cmt { color: var(--text-dim); font-style: italic; }
  .tok-plain { color: var(--text-secondary); }

  /* Clear history */
  .clear-history {
    display: none; align-items: center; justify-content: center;
    gap: 6px; padding: 8px; margin: 8px 0;
    background: transparent; border: 1px dashed var(--border);
    border-radius: var(--radius-sm); cursor: pointer; width: 100%;
    font-size: 12px; color: var(--text-dim);
    transition: color 0.15s, border-color 0.15s;
  }
  .clear-history:hover { color: var(--red); border-color: var(--red); }
  .clear-history.visible { display: flex; }

  /* ── Input area ── */
  .input-area {
    flex-shrink: 0; max-width: 680px; width: 100%; margin: 0 auto;
    border-top: 1px solid var(--border-subtle);
    background: rgba(9,9,11,0.9); backdrop-filter: blur(12px);
    padding: 16px 20px 24px;
  }
  .wave-wrap { width: 100%; height: 40px; margin-bottom: 12px; }
  canvas#wave { width: 100%; height: 100%; display: block; }
  .input-row {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  #micBtn {
    position: relative; z-index: 2;
    width: 52px; height: 52px; border-radius: 50%;
    border: 1.5px solid var(--border); background: var(--surface-2);
    color: var(--text-muted); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s ease;
    -webkit-tap-highlight-color: transparent; user-select: none;
  }
  #micBtn svg { width: 20px; height: 20px; }
  #micBtn:hover { border-color: var(--text-dim); color: var(--text-secondary); }
  #micBtn:active { transform: scale(0.95); }
  .mic-ring {
    position: absolute; inset: -6px; z-index: 1;
    border-radius: 50%; border: 2px solid transparent;
    transition: all 0.3s ease;
  }
  #micBtn.recording { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  #micBtn.recording ~ .mic-ring {
    border-color: rgba(245,158,11,0.25);
    animation: ring-pulse 1.5s ease-in-out infinite;
  }
  #micBtn.processing { border-color: var(--blue); color: var(--blue); background: var(--blue-soft); }
  #micBtn.processing ~ .mic-ring {
    border-color: rgba(59,130,246,0.2);
    animation: ring-pulse 1s ease-in-out infinite;
  }
  @keyframes ring-pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.15); opacity: 0.4; }
  }
  .status-text {
    font-size: 12.5px; font-weight: 500; color: var(--text-dim);
    transition: color 0.25s;
  }
  .status-text.recording { color: var(--accent); }
  .status-text.error { color: var(--red); }
  .status-text.ready { color: var(--emerald); }

  /* ── Responsive ── */
  @media (max-width: 640px) {
    .nav-tag { display: none; }
    .input-area { padding: 12px 16px 20px; }
    .chat-area { padding: 16px 12px; }
  }
</style>
</head>
<body>

<div class="bg-mesh"></div>

<!-- Navigation -->
<nav class="nav">
  <a href="/" class="nav-brand">
    <div class="nav-logo">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M7 4v16M12 8v8M17 6v12" stroke="#09090b" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </div>
    <span class="nav-name">VoicOps</span>
    <span class="nav-tag">v0.2</span>
  </a>
  <div class="nav-links">
    <a href="/" class="nav-link">Home</a>
    <a href="/generate" class="nav-link active">Generate</a>
    <a href="/analytics" class="nav-link">Analytics</a>
  </div>
</nav>

<!-- App layout -->
<div class="app">
  <div class="chat-area" id="chatArea">
    <div class="welcome" id="welcome">
      <div class="welcome-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </div>
      <h2>Speak to generate</h2>
      <p>Hold the mic button and describe the infrastructure you need. VoicOps will handle the rest.</p>
      <div class="welcome-hints">
        <span class="welcome-hint">"Node.js with Redis"</span>
        <span class="welcome-hint">"Flask and PostgreSQL"</span>
        <span class="welcome-hint">"Django with MySQL"</span>
      </div>
    </div>
  </div>

  <!-- Input area -->
  <div class="input-area">
    <div class="wave-wrap"><canvas id="wave"></canvas></div>
    <div class="input-row">
      <div style="position:relative;">
        <button id="micBtn" aria-label="Hold to record">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="23"></line>
            <line x1="8" y1="23" x2="16" y2="23"></line>
          </svg>
        </button>
        <div class="mic-ring"></div>
      </div>
      <div class="status-text" id="status">Hold to record — speak your stack</div>
    </div>
    <button id="clearHistory" class="clear-history" onclick="clearHistory()">Clear history</button>
  </div>
</div>

<script>
  const micBtn = document.getElementById('micBtn');
  const statusEl = document.getElementById('status');
  const chatArea = document.getElementById('chatArea');
  const welcomeEl = document.getElementById('welcome');
  const clearHistoryBtn = document.getElementById('clearHistory');
  const canvas = document.getElementById('wave');
  const ctx = canvas.getContext('2d');

  let mediaRecorder, audioChunks = [];
  let audioCtx, analyser, dataArray, rafId, stream;
  const STORAGE_KEY = 'voicops_chat_history';
  let chatHistory = [];

  // ── Persistence ──
  function saveHistory() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(chatHistory)); } catch(e) {}
    clearHistoryBtn.classList.toggle('visible', chatHistory.length > 0);
  }
  function restoreHistory() {
    try { chatHistory = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch(e) { chatHistory = []; }
    if (chatHistory.length > 0) {
      welcomeEl.style.display = 'none';
      chatHistory.forEach(function(msg) { renderMessage(msg, false); });
      scrollToBottom();
    }
    clearHistoryBtn.classList.toggle('visible', chatHistory.length > 0);
  }
  function clearHistory() {
    chatHistory = []; chatArea.innerHTML = '';
    chatArea.appendChild(welcomeEl); welcomeEl.style.display = 'flex';
    saveHistory();
  }
  function removeMessage(msg) {
    var idx = chatHistory.indexOf(msg);
    if (idx >= 0) chatHistory.splice(idx, 1);
    rebuildChat(); saveHistory();
  }
  function rebuildChat() {
    chatArea.innerHTML = '';
    if (chatHistory.length === 0) { chatArea.appendChild(welcomeEl); welcomeEl.style.display = 'flex'; }
    else { welcomeEl.style.display = 'none'; chatHistory.forEach(function(m) { renderMessage(m, false); }); scrollToBottom(); }
  }
  function scrollToBottom() { requestAnimationFrame(function() { chatArea.scrollTop = chatArea.scrollHeight; }); }

  function setStatus(t, c) { statusEl.textContent = t; statusEl.className = 'status-text' + (c ? ' ' + c : ''); }
  function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // ── Syntax highlighters ──
  function highlightDockerfile(t) {
    var kws=['FROM','WORKDIR','COPY','RUN','EXPOSE','CMD','ENV','ENTRYPOINT','ARG','LABEL','ADD','VOLUME','USER','SHELL'];
    return escapeHtml(t).split('\n').map(function(l){var m=l.match(/^([A-Z]+)(\s.*)?$/);if(m&&kws.indexOf(m[1])>=0)return'<span class="tok-kw">'+m[1]+'</span><span class="tok-plain">'+(m[2]||'')+'</span>';return'<span class="tok-plain">'+l+'</span>';}).map(function(l){return'<span class="line">'+l+'</span>';}).join('');
  }
  function highlightYaml(t) {
    return escapeHtml(t).split('\n').map(function(l){var m=l.match(/^(\s*)([\w."'-]+):(.*)$/);if(m)return m[1]+'<span class="tok-key">'+m[2]+'</span>:<span class="tok-plain">'+m[3]+'</span>';if(/^\s*-\s/.test(l))return'<span class="tok-str">'+l+'</span>';if(/^\s*#/.test(l))return'<span class="tok-cmt">'+l+'</span>';return'<span class="tok-plain">'+l+'</span>';}).map(function(l){return'<span class="line">'+l+'</span>';}).join('');
  }
  function highlightHCL(t) {
    var kws=['resource','variable','provider','data','output','module','locals','terraform'];
    return escapeHtml(t).split('\n').map(function(l){if(/^\s*#/.test(l))return'<span class="tok-cmt">'+l+'</span>';var bm=l.match(/^(\s*)(resource|variable|provider|data|output|module|locals|terraform)(\s.*)?$/);if(bm&&kws.indexOf(bm[2])>=0)return bm[1]+'<span class="tok-kw">'+bm[2]+'</span><span class="tok-plain">'+(bm[3]||'')+'</span>';var am=l.match(/^(\s*)([\w.]+)(\s*=\s*)(.*)?$/);if(am){var v=am[4]||'';var vc=/"/.test(v)?'tok-str':'tok-plain';return am[1]+'<span class="tok-key">'+am[2]+'</span>'+am[3]+'<span class="'+vc+'">'+v+'</span>';}return'<span class="tok-plain">'+l+'</span>';}).map(function(l){return'<span class="line">'+l+'</span>';}).join('');
  }

  // ── Render message ──
  function renderMessage(msg, animate) {
    if (animate === undefined) animate = true;
    var el = document.createElement('div');
    el.className = 'chat-msg';
    if (!animate) el.style.animation = 'none';
    var time = msg.timestamp || '';
    var rawT = (msg.transcript || '').trim();
    var corrT = (msg.corrected_transcript || '').trim();
    var hasD=!!msg.dockerfile, hasC=!!msg.docker_compose, hasT=!!msg.terraform;
    var v = msg.validation || {};
    var tH = '<div class="msg-transcript">';
    if (rawT) { tH+='<div class="msg-heard">Heard: <em>"'+escapeHtml(rawT)+'"</em></div><div class="msg-understood">Understood: <em>"'+escapeHtml(corrT||rawT)+'"</em></div>'; }
    if (msg.unsupported&&msg.unsupported.length) tH+='<div class="msg-unsupported">Not supported: '+msg.unsupported.map(escapeHtml).join(', ')+'</div>';
    tH += '</div>';
    var fH = '<div class="msg-files">';
    var fd = [];
    if (hasD) fd.push({c:'docker',l:'D',n:'Dockerfile',x:msg.dockerfile,h:'df',v:v.dockerfile});
    if (hasC) fd.push({c:'compose',l:'C',n:'docker-compose.yml',x:msg.docker_compose,h:'yaml',v:null});
    if (hasT) fd.push({c:'terraform',l:'T',n:'main.tf',x:msg.terraform,h:'hcl',v:v.terraform});
    if (fd.length>0) { fd.forEach(function(f,i){ var b=''; if(f.v){if(!f.v.tool_available)b='<span class="file-badge na">N/A</span>';else if(f.v.healing_count>0&&f.v.valid)b='<span class="file-badge healed">healed '+f.v.healing_count+'x</span>';else if(f.v.valid)b='<span class="file-badge pass">valid</span>';else b='<span class="file-badge fail">invalid</span>';} var hl=f.h==='df'?highlightDockerfile:f.h==='yaml'?highlightYaml:highlightHCL; fH+='<div class="file-card"><div class="file-head"><div class="file-name"><span class="file-icon '+f.c+'">'+f.l+'</span>'+f.n+b+'</div><div class="file-actions"><button class="copy-btn" data-idx="'+i+'" title="Copy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button><button class="dl-btn" data-idx="'+i+'" title="Download"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button></div></div><div class="file-body">'+hl(f.x)+'</div></div>'; }); }
    else fH += '<div class="msg-empty-result">No services detected — try a clearer voice command.</div>';
    fH += '</div>';
    el.innerHTML = '<div class="msg-head"><span class="msg-time">'+time+'</span><button class="msg-close" title="Remove">\u00d7</button></div>' + tH + fH;
    el.querySelector('.msg-close').addEventListener('click', function(){ removeMessage(msg); });
    el.querySelectorAll('.copy-btn').forEach(function(btn){var i=parseInt(btn.dataset.idx);btn.addEventListener('click',function(){navigator.clipboard.writeText(fd[i].x);btn.textContent='\u2713';setTimeout(function(){btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';},1200);});});
    el.querySelectorAll('.dl-btn').forEach(function(btn){var i=parseInt(btn.dataset.idx);btn.addEventListener('click',function(){var f=fd[i];var blob=new Blob([f.x],{type:'text/plain'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download=f.n;a.click();URL.revokeObjectURL(url);});});
    chatArea.appendChild(el);
    if (animate) scrollToBottom();
    return el;
  }

  // ── WebM to WAV ──
  async function webmToWav(webmBlob) {
    var ab = await webmBlob.arrayBuffer();
    var ac = new (window.AudioContext || window.webkitAudioContext)();
    var buf = await ac.decodeAudioData(ab); ac.close();
    var ch=buf.numberOfChannels, sr=buf.sampleRate, len=buf.length;
    var wb=new ArrayBuffer(44+len*ch*2), dv=new DataView(wb);
    function ws(o,s){for(var i=0;i<s.length;i++)dv.setUint8(o+i,s.charCodeAt(i));}
    ws(0,'RIFF');dv.setUint32(4,36+len*ch*2,true);ws(8,'WAVE');ws(12,'fmt ');
    dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,ch,true);
    dv.setUint32(24,sr,true);dv.setUint32(28,sr*ch*2,true);dv.setUint16(32,ch*2,true);
    dv.setUint16(34,16,true);ws(36,'data');dv.setUint32(40,len*ch*2,true);
    var channels=[];for(var c=0;c<ch;c++)channels.push(buf.getChannelData(c));
    var off=44;for(var i=0;i<len;i++)for(var c=0;c<ch;c++){var s=Math.max(-1,Math.min(1,channels[c][i]));dv.setInt16(off,s<0?s*0x8000:s*0x7FFF,true);off+=2;}
    return {blob:new Blob([wb],{type:'audio/wav'}),duration:len/sr};
  }

  // ── Canvas ──
  function resizeCanvas(){var r=canvas.getBoundingClientRect();canvas.width=r.width*devicePixelRatio;canvas.height=r.height*devicePixelRatio;}
  window.addEventListener('resize',resizeCanvas);resizeCanvas();
  function drawIdle(){var w=canvas.width,h=canvas.height,bc=48,gap=w/bc;ctx.clearRect(0,0,w,h);for(var i=0;i<bc;i++){ctx.fillStyle='#27272a';ctx.beginPath();ctx.roundRect(i*gap+gap*.25,h/2-2,gap*.5,4,1.5);ctx.fill();}}
  drawIdle();
  function drawLive(){analyser.getByteFrequencyData(dataArray);var w=canvas.width,h=canvas.height,bc=48,gap=w/bc,step=Math.floor(dataArray.length/bc);ctx.clearRect(0,0,w,h);for(var i=0;i<bc;i++){var v=dataArray[i*step]/255,bh=Math.max(3,v*h*0.8);var g=ctx.createLinearGradient(0,h/2-bh/2,0,h/2+bh/2);g.addColorStop(0,'#f59e0b');g.addColorStop(1,'#d97706');ctx.fillStyle=g;ctx.globalAlpha=0.5+v*0.5;ctx.beginPath();ctx.roundRect(i*gap+gap*.25,h/2-bh/2,gap*.5,bh,2);ctx.fill();}ctx.globalAlpha=1;rafId=requestAnimationFrame(drawLive);}

  // ── Recording ──
  async function startRecording(){try{stream=await navigator.mediaDevices.getUserMedia({audio:true});audioCtx=new(window.AudioContext||window.webkitAudioContext)();var src=audioCtx.createMediaStreamSource(stream);analyser=audioCtx.createAnalyser();analyser.fftSize=128;dataArray=new Uint8Array(analyser.frequencyBinCount);src.connect(analyser);drawLive();mediaRecorder=new MediaRecorder(stream);audioChunks=[];mediaRecorder.ondataavailable=function(e){audioChunks.push(e.data);};mediaRecorder.onstop=async function(){var wb=new Blob(audioChunks,{type:'audio/webm'});stream.getTracks().forEach(function(t){t.stop();});cancelAnimationFrame(rafId);audioCtx.close();drawIdle();var r=await webmToWav(wb);if(r.duration<0.5){setStatus('Too short — hold longer','error');micBtn.classList.remove('recording','processing');return;}await sendAudio(r.blob);};mediaRecorder.start();micBtn.classList.add('recording');setStatus('Listening...','recording');}catch(e){setStatus('Microphone access denied','error');}}
  function stopRecording(){if(mediaRecorder&&mediaRecorder.state!=='inactive')mediaRecorder.stop();micBtn.classList.remove('recording');micBtn.classList.add('processing');setStatus('Processing...','');}

  async function sendAudio(audioBlob){var fd=new FormData();fd.append('audio',audioBlob,'command.wav');try{setStatus('Generating configs...','');var res=await fetch('/generate-config',{method:'POST',body:fd});if(!res.ok)throw new Error(res.status===502?'Service unreachable.':'Failed ('+res.status+')');var data=await res.json();micBtn.classList.remove('processing');var msg={timestamp:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'}),transcript:data.transcript||'',corrected_transcript:data.corrected_transcript||'',unsupported:data.unsupported||[],dockerfile:data.dockerfile||null,docker_compose:data.docker_compose||null,terraform:data.terraform||null,validation:data.validation||{}};if(data.dockerfile||data.docker_compose||data.terraform){var parts=[];if(data.dockerfile||data.docker_compose)parts.push('Docker');if(data.terraform)parts.push('Terraform');setStatus(parts.join(' + ')+' generated','ready');}else{setStatus('No service name detected');}welcomeEl.style.display='none';chatHistory.push(msg);renderMessage(msg);saveHistory();}catch(e){micBtn.classList.remove('processing');setStatus(e.message,'error');}}

  micBtn.addEventListener('mousedown',startRecording);
  micBtn.addEventListener('mouseup',stopRecording);
  micBtn.addEventListener('mouseleave',function(){if(mediaRecorder&&mediaRecorder.state==='recording')stopRecording();});
  micBtn.addEventListener('touchstart',function(e){e.preventDefault();startRecording();});
  micBtn.addEventListener('touchend',function(e){e.preventDefault();stopRecording();});

  restoreHistory();
</script>
